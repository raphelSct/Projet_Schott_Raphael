<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteneur">

        <!-- ===== Formulaire d'inscription ===== -->
        <section class="carte" id="carte-formulaire">
            <header class="carte-entete">
                <h1>Créer un compte</h1>
                <p class="sous-titre">Tous les champs sont obligatoires.</p>
            </header>

            <form id="formulaire-inscription" novalidate>

                <div class="champ">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" autocomplete="username" required>
                    <small class="erreur" id="erreur-login"></small>
                </div>

                <div class="champ">
                    <label for="motdepasse">Mot de passe</label>
                    <input type="password" id="motdepasse" name="motdepasse" autocomplete="new-password" required>
                    <small class="erreur" id="erreur-motdepasse"></small>
                </div>

                <div class="champ">
                    <label for="confirmation">Confirmation du mot de passe</label>
                    <input type="password" id="confirmation" name="confirmation" autocomplete="new-password" required>
                    <small class="erreur" id="erreur-confirmation"></small>
                </div>

                <div class="ligne">
                    <div class="champ">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" autocomplete="family-name" required>
                        <small class="erreur" id="erreur-nom"></small>
                    </div>

                    <div class="champ">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
                        <small class="erreur" id="erreur-prenom"></small>
                    </div>
                </div>

                <div class="champ">
                    <label for="adresse">Adresse</label>
                    <input type="text" id="adresse" name="adresse" autocomplete="street-address" required>
                    <small class="erreur" id="erreur-adresse"></small>
                </div>

                <div class="champ">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <small class="erreur" id="erreur-email"></small>
                </div>

                <div class="ligne">
                    <div class="champ">
                        <label for="telephone">Téléphone</label>
                        <input type="text" id="telephone" name="telephone" autocomplete="tel" required>
                        <small class="erreur" id="erreur-telephone"></small>
                    </div>

                    <div class="champ">
                        <label for="naissance">Date de naissance</label>
                        <input type="date" id="naissance" name="naissance" autocomplete="bday" required>
                        <small class="erreur" id="erreur-naissance"></small>
                    </div>
                </div>

                <p class="erreur-globale" id="erreur-globale" role="alert" hidden></p>

                <button type="submit" class="bouton">S'inscrire</button>
            </form>
        </section>

        <!-- ===== Page récapitulative ===== -->
        <section class="carte" id="carte-recapitulatif" hidden>
            <header class="carte-entete">
                <h1>Inscription confirmée</h1>
                <p class="sous-titre">Voici le récapitulatif des informations saisies.</p>
            </header>

            <dl class="recapitulatif">
                <div class="recapitulatif-ligne">
                    <dt>Login</dt>
                    <dd id="recap-login"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Nom</dt>
                    <dd id="recap-nom"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Prénom</dt>
                    <dd id="recap-prenom"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Adresse</dt>
                    <dd id="recap-adresse"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Email</dt>
                    <dd id="recap-email"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Téléphone</dt>
                    <dd id="recap-telephone"></dd>
                </div>
                <div class="recapitulatif-ligne">
                    <dt>Date de naissance</dt>
                    <dd id="recap-naissance"></dd>
                </div>
            </dl>

            <button type="button" class="bouton bouton-secondaire" id="bouton-retour">Modifier mes informations</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
